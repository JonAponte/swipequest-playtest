<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!--
      SwipeQuest responsive Web template.

      Replaces Unity's stock fixed-size canvas (which pinned the player at 540x960 and simply
      letterboxed the rest of the browser window) with a canvas that FILLS the window in every
      case - desktop and mobile alike. That is what makes browser rotation actually resize the
      game: Unity keeps the WebGL render target matched to the canvas DOM size, so a rotation
      changes Screen.width/Screen.height, which is exactly the signal AspectLayoutController
      watches to re-layout the 1:1 safe core live.

      Deliberately no fixed WIDTH/HEIGHT anywhere in the CSS. The 1080/1920
      player settings survive only as the canvas backing-store size for the first frame, before
      the first resize sync.
    -->
    <title>SwipeQuest</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14141f;
        /* Stop the browser from hijacking swipes as scroll/zoom gestures - the whole game is
           swipes, so every touch must reach the canvas. */
        touch-action: none;
        overscroll-behavior: none;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #14141f;
        touch-action: none;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        width: 60%;
        max-width: 320px;
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 12px;
        background: #2a2a3a;
        border-radius: 6px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #ff8c26;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        font-family: sans-serif;
        color: #fff;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SwipeQuest",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Left at its default (true) on purpose: Unity then keeps the WebGL render target matched to
      // the canvas DOM size (times devicePixelRatio), so Screen.width/height follow the window and
      // a device rotation is delivered to the game as a plain aspect change.
      // config.matchWebGLToCanvasSize = false;

      // Belt and braces for iOS Safari, which fires orientationchange BEFORE it settles the new
      // viewport size: poke the layout again a beat later so the canvas ends on the real size.
      function nudgeCanvasSize() {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }
      window.addEventListener("resize", nudgeCanvasSize);
      window.addEventListener("orientationchange", function () {
        nudgeCanvasSize();
        setTimeout(nudgeCanvasSize, 250);
      });

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          nudgeCanvasSize();
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
